# =============================================================================
#  Nginx — Dokumentasi Laravel Security Monitor (Astro, situs statis)
# =============================================================================
#
#  Menyajikan hasil build statis (folder `dist/`) pada:
#      https://<domain>/laravel-security-monitor/
#
#  Tata letak di VPS (isi folder `dist/` diletakkan di dalam sub-folder yang
#  sama dengan nilai `base` pada astro.config.mjs):
#
#      /var/www/laravel-security-monitor-docs/
#      └── laravel-security-monitor/        <-- isi folder `dist/`
#          ├── index.html
#          ├── 404.html
#          ├── _astro/                       <-- aset ber-hash (immutable)
#          ├── pagefind/                     <-- indeks pencarian
#          └── getting-started/ ... dst
#
#  Langkah deploy:
#      1) Di mesin lokal:
#           cd web
#           npm ci
#           npm run build
#      2) Unggah ke VPS (rsync menghapus berkas lama agar sinkron):
#           rsync -a --delete dist/ user@<vps>:/var/www/laravel-security-monitor-docs/laravel-security-monitor/
#      3) Di VPS:
#           sudo cp nginx.conf /etc/nginx/sites-available/laravel-security-monitor-docs
#           sudo ln -s /etc/nginx/sites-available/laravel-security-monitor-docs /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
#  Sertifikat TLS (Let's Encrypt) — setelah DNS mengarah ke VPS:
#           sudo certbot --nginx -d docs.example.com
#
#  Ganti seluruh "docs.example.com" dengan domain/subdomain Anda.
#  Berkas ini adalah potongan `server { ... }` (konteks http), sehingga
#  `mime.types` bawaan nginx sudah aktif.
#
#  Penting: saat deploy ke VPS, ubah `site` pada astro.config.mjs menjadi
#  domain VPS Anda (mis. https://docs.example.com) lalu build ulang, agar tag
#  canonical dan sitemap.xml menunjuk ke domain yang benar. Nilai `base`
#  tetap '/laravel-security-monitor' agar cocok dengan konfigurasi ini.
# =============================================================================


# --- Kompresi (aktifkan di konteks http; aman diulang di sini) --------------
gzip            on;
gzip_vary       on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied    any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    font/woff2;


# =============================================================================
#  HTTP :80  ->  redirect ke HTTPS (+ jalur ACME untuk certbot)
# =============================================================================
server {
    listen      [::]:80;
    listen      80;
    server_name docs.example.com;

    # Biarkan certbot memverifikasi domain sebelum redirect permanen aktif.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# =============================================================================
#  HTTPS :443  (blok utama)
# =============================================================================
server {
    listen      [::]:443 ssl http2;
    listen      443 ssl http2;
    # Catatan: pada nginx >= 1.25.1, `http2` pada `listen` sudah usang; gunakan
    #           `listen 443 ssl;` lalu tambahkan baris `http2 on;`.

    server_name docs.example.com;

    # --- Sertifikat TLS (Let's Encrypt) ---
    ssl_certificate         /etc/letsencrypt/live/docs.example.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/docs.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/docs.example.com/chain.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # --- Header keamanan (diwariskan ke seluruh lokasi di bawah) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    server_tokens off;
    charset       utf-8;

    # --- Akar dokumen & log ---
    root  /var/www/laravel-security-monitor-docs;
    index index.html;

    access_log /var/log/nginx/laravel-security-monitor-docs.access.log;
    error_log  /var/log/nginx/laravel-security-monitor-docs.error.log warn;

    # HTML tidak di-cache lama; lokasi aset di bawah akan menimpanya.
    expires -1;

    # --- Halaman 404 kustom dari Astro ---
    error_page 404 /laravel-security-monitor/404.html;
    location = /laravel-security-monitor/404.html {
        internal;
    }

    # --- Root domain diarahkan ke dokumentasi ---
    location = / {
        return 301 /laravel-security-monitor/;
    }

    # --- Base tanpa garis miring -> tambahkan garis miring ---
    location = /laravel-security-monitor {
        return 301 /laravel-security-monitor/;
    }

    # --- Aset ber-hash (boleh di-cache sangat lama) ---
    location /laravel-security-monitor/_astro/ {
        try_files $uri =404;
        expires   1y;
        access_log off;
    }

    # --- Indeks pencarian Pagefind ---
    location /laravel-security-monitor/pagefind/ {
        try_files $uri =404;
        expires   7d;
        access_log off;
    }

    # --- Situs dokumentasi (statis) ---
    # `$uri/` melayani index.html untuk URL berakhiran "/" (gaya Astro).
    location /laravel-security-monitor/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # --- Kecilkan noise log & blokir berkas tersembunyi ---
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location ~ /\.(?!well-known) { deny all; }
}


# =============================================================================
#  ALTERNATIF — menyajikan di ROOT subdomain: https://docs.example.com/
# =============================================================================
#
#  Lebih sederhana (tanpa sub-path). Langkahnya:
#    1) Pada astro.config.mjs: hapus `base` (atau set `base: '/'`), lalu build ulang.
#    2) Susun berkas langsung di akar:
#         /var/www/laravel-security-monitor-docs/laravel-security-monitor/  -> dist/*
#       (atau ubah `root` di bawah ke folder tempat Anda menaruh `dist/`).
#    3) Gunakan blok server berikut sebagai ganti blok HTTPS di atas.
#
# server {
#     listen [::]:443 ssl http2;
#     listen 443 ssl http2;
#     server_name docs.example.com;
#
#     # ... (SSL + header keamanan sama seperti blok utama) ...
#
#     root  /var/www/laravel-security-monitor-docs/laravel-security-monitor;
#     index index.html;
#     expires -1;
#
#     location = /            { try_files /index.html =404; }
#     location /_astro/       { try_files $uri =404; expires 1y; access_log off; }
#     location /pagefind/     { try_files $uri =404; expires 7d; access_log off; }
#     location /              { try_files $uri $uri/ $uri/index.html =404; }
#
#     error_page 404 /404.html;
#     location = /404.html { internal; }
#
#     location = /favicon.ico { access_log off; log_not_found off; }
#     location = /robots.txt  { access_log off; log_not_found off; }
#     location ~ /\.(?!well-known) { deny all; }
# }
